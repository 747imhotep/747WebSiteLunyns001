      <script>
      // Extract the 'serial' parameter from URL and insert into the page
        document.addEventListener('DOMContentLoaded', () => {
          const urlParams = new URLSearchParams(window.location.search);
          const serial = urlParams.get('serial');

          const serialDisplayElem = document.getElementById('serialDisplay');
          if (serial && serialDisplayElem) {
          serialDisplayElem.textContent = serial;
          } else if (serialDisplayElem) {
          serialDisplayElem.textContent = "N/A";
          }
        });
      </script>

      <script>
    document.addEventListener("DOMContentLoaded", () => {
    const msg = document.getElementById("thanks-message");
    const countdown = document.getElementById("redirect-countdown");
    let seconds = 4; // 4-second delay

    // ✨ Fade-in effect
    msg.style.opacity = "0";
    msg.style.transition = "opacity 1s ease-in-out";
    setTimeout(() => { msg.style.opacity = "1"; }, 200);

    // ⏳ Countdown display
    const interval = setInterval(() => {
      seconds--;
      if (countdown) countdown.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "/"; // redirect home
      }
    }, 1000);
  });
</script>
