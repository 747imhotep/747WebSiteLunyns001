<!-- TEST HTML -->

<section id="rfq-form" class="rfq-section">
  <h2>Request FREE Quotation!</h2>

  <form id="contactForm" action="/upload.php" method="POST" enctype="multipart/form-data">
    <label for="name">Name:*</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:*</label>
    <input type="email" id="email" name="email" placeholder="Email Address" required>

    <label for="subject">Subject:*</label>
    <input type="text" id="subject" name="subject" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4"></textarea>

    <label for="file">Upload Document</label>
    <input type="file" id="file" name="attachment" accept=".pdf,.doc,.docx,.jpg,.png">

    <button type="submit" class="btn btn-light">Send Message</button>
    <button type="button" id="clearFormBtn" class="btn btn-secondary">Clear Form</button>
  </form>
</section>
